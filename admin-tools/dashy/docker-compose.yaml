services:
  dashy:
    image: "lissy93/dashy:${DASHY_VERSION:-latest}"
    restart: always
    container_name: dashy
    environment:
      - TZ=America/New_York
    volumes:
      - "./config/conf.yml:/app/user-data/conf.yml"
      ## Place other pages under this folder and link in the `conf.yml`
      - "./config:/app/user-data"
    labels:
      - traefik.enable=true
      - traefik.http.routers.dash.rule=Host(`$HOST`) || Host(`$HOSTNAME`)
      - traefik.http.routers.dash.entrypoints=http
      - traefik.http.services.dash.loadbalancer.server.port=8080
      - kuma.dash.http.name=Dashy
      - kuma.dash.http.url=http://dashy:8080
