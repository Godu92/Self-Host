services:
  glances:
    image: "nicolargo/glances:${GLANCES_VERSION:-latest}"
    networks:
      default:
      socket_proxy:
    environment:
      - TZ=America/New_York
      - PGID=1000
      - PUID=1000
      - GLANCES_OPT=-w
      # Connect through the socket-proxy (infra/socket) instead of mounting
      # docker.sock directly (glances' docker plugin uses docker.from_env()).
      - DOCKER_HOST=tcp://socket-proxy:2375
    privileged: true
    pid: host
    deploy:
      resources:
        limits:
          memory: 512m
    ports:
      - "61208:61208"
    restart: always
    container_name: glances

    labels:
      - traefik.enable=true
      - traefik.http.routers.glance.rule=Host(`glance.$HOST`) || Host(`glance.$HOSTNAME`)
      - traefik.http.routers.glance.entrypoints=http
      - traefik.http.services.glance.loadbalancer.server.port=61208
      - traefik.docker.network=proxy
