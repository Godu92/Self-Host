services:
  watchtower:
    image: containrrr/watchtower:${WATCHTOWER_VERSION:-latest}
    container_name: watchtower
    restart: always
    networks:
      default:
      socket_proxy:
    environment:
      # Connect through the socket-proxy (infra/socket) instead of mounting
      # docker.sock directly.
      - DOCKER_HOST=tcp://socket-proxy:2375
    command: --interval 3600 # Check for updates every hour (3600s)
    # Note: watchtower has no HTTP UI, so this route was never functional even
    # before this change (also missing a loadbalancer.server.port label) —
    # left as-is beyond fixing the invalid entrypoints value, not in scope here.
    labels:
      - traefik.enable=true
      - traefik.http.routers.watch.rule=Host(`watch.$HOST`)
      - traefik.http.routers.watch.entrypoints=http
      - traefik.docker.network=proxy
