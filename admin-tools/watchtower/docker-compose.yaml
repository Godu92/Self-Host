services:
  watchtower:
    image: containrrr/watchtower:${WATCHTOWER_VERSION:-latest}
    container_name: watchtower
    restart: always
    networks:
      default:
      socket_proxy:
    environment:
      # Connect through the socket-proxy (infra/socket) instead of mounting
      # docker.sock directly.
      - DOCKER_HOST=tcp://socket-proxy:2375
    command: --interval 3600 # Check for updates every hour (3600s)
    # No Traefik labels: watchtower has no HTTP UI, so a route here would always be dead
    # weight (previously carried one anyway, missing a loadbalancer.server.port label —
    # removed rather than completed).
