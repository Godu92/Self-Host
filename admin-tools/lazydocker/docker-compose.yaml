services:
  lazydocker:
    image: lazyteam/lazydocker:${LAZYDOCKER_VERSION:-latest}
    container_name: lazydocker
    stdin_open: true
    tty: true
    networks:
      default:
      socket_proxy:
    environment:
      # Connect through the socket-proxy (infra/socket) instead of mounting
      # docker.sock directly. Note: EXEC is off by default on the proxy, so
      # lazydocker's "shell into a container" feature won't work through it.
      - DOCKER_HOST=tcp://socket-proxy:2375
    volumes:
      - ./config:/.config/jesseduffield/lazydocker
    # No Traefik labels: lazydocker is an interactive terminal UI (stdin_open/tty), it has no
    # HTTP server to route to. Previously carried a dead route pointing at a typo'd
    # `lazy.locahost` — removed rather than fixed, since there was never anything for it to
    # route to in the first place.
