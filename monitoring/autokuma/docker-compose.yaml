# version: "3"

services:
  autokuma:
    image: ghcr.io/bigboot/autokuma:${AUTOKUMA_VERSION:-latest}
    restart: unless-stopped
    container_name: autokuma
    networks:
      default:
      socket_proxy:
    environment:
      # uptime-kuma has no env-based initial-admin setup — create the account once via its
      # own first-run web UI (monitoring/uptime), then set these two to match.
      AUTOKUMA__KUMA__URL: http://uptime-kuma:3001
      AUTOKUMA__KUMA__USERNAME: ${AUTOKUMA_KUMA_USERNAME}
      AUTOKUMA__KUMA__PASSWORD: ${AUTOKUMA_KUMA_PASSWORD}
      # AUTOKUMA__KUMA__MFA_TOKEN: <token>
      # AUTOKUMA__KUMA__HEADERS: "<header1_key>=<header1_value>,<header2_key>=<header2_value>,..."
      # AUTOKUMA__KUMA__CALL_TIMEOUT: 5
      # AUTOKUMA__KUMA__CONNECT_TIMEOUT: 5
      # AUTOKUMA__TAG_NAME: AutoKuma
      # AUTOKUMA__TAG_COLOR: "#42C0FB"
      # AUTOKUMA__DEFAULT_SETTINGS: |-
      #   docker.docker_container: {{container_name}}
      #   http.max_redirects: 10
      #   *.max_retries: 3
      # AUTOKUMA__SNIPPETS__WEB: |-
      #   {{container_name}}_http.http.name: {{container_name}} HTTP
      #   {{container_name}}_http.http.url: https://{{@0}}:{{@1}}
      #   {{container_name}}_docker.docker.name: {{container_name}} Docker
      #   {{container_name}}_docker.docker.docker_container: {{container_name}}
      # Connect through the socket-proxy (infra/socket) instead of mounting
      # docker.sock directly.
      AUTOKUMA__DOCKER__HOSTS: tcp://socket-proxy:2375
      AUTOKUMA__DOCKER__LABEL_PREFIX: kuma
      AUTOKUMA__DOCKER__EXCLUDE_CONTAINER_PATTERNS: "^[a-f0-9]{12}_.*_" # Exclude Docker Compose temporary containers

    volumes:
      - ${AUTOKUMA_DATA_DIR:-autokuma-data}:/data
    # No Traefik labels: AutoKuma is a background sync daemon with no HTTP server of its own
    # (it only connects out to Uptime Kuma). The commented block that used to live here pointed
    # at port 3001 — that's Uptime Kuma's own port, copy-pasted in error — removed rather than
    # kept as a misleading template.

volumes:
  autokuma-data:
    name: autokuma-data
    external: false
