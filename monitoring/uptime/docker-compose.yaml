services:
  uptime-kuma:
    image: louislam/uptime-kuma:${UPTIME_KUMA_VERSION:-latest}
    container_name: uptime-kuma
    networks:
      default:
      socket_proxy:
    # No docker.sock mount needed — if you want a "Docker Container" monitor,
    # add a Docker Host in Settings > Docker Hosts with type "tcp" and
    # "tcp://socket-proxy:2375" (infra/socket) instead of "socket".
    volumes:
      - "${UPTIME_DATA_DIR:-up-data}:/app/data"
    ports:
      - "3001:3001"
    restart: always
    deploy:
      resources:
        limits:
          memory: 512m
    environment:
      - UPTIME_KUMA_DISABLE_FRAME_SAMEORIGIN=true
      - BASE_URL=uptime.$HOST
    labels:
      - traefik.enable=true
      - traefik.http.routers.uptime.rule=Host(`uptime.$HOST`)
      - traefik.http.routers.uptime.entrypoints=http
      - traefik.http.services.uptime.loadbalancer.server.port=3001
      - traefik.docker.network=proxy
## See this for more config information: https://www.smarthomebeginner.com/uptime-kuma-docker-compose-guide/

volumes:
  up-data:
    name: up-data
    external: false
