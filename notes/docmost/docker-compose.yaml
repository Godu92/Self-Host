# version: "3"

services:
  docmost:
    image: docmost/docmost:${DOCMOST_VERSION:-latest}
    container_name: docmost
    depends_on:
      - docmost-db
      - docmost-redis
    environment:
      APP_URL: "http://doc.$HOST"
      APP_SECRET: "${APP_SECRET}"
      DATABASE_URL: "postgresql://docmost:${POSTGRES_PASSWORD}@docmost-db:5432/docmost?schema=public"
      REDIS_URL: "redis://docmost-redis:6379"
    # ports:
    # - "3000:3000"
    restart: always
    volumes:
      - ${DOCMOST_DATA_DIR:-docmost}:/app/data/storage
    labels:
      - traefik.enable=true
      - traefik.http.routers.doc.rule=Host(`doc.$HOST`)
      - traefik.http.routers.doc.entrypoints=http
      - traefik.http.services.doc.loadbalancer.server.port=3000

  docmost-db:
    image: postgres:${POSTGRES_VERSION:-latest}-alpine
    container_name: docmost-db
    environment:
      POSTGRES_DB: docmost
      POSTGRES_USER: docmost
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    restart: always
    expose:
      - 5432
    volumes:
      - ${DOCMOST_DB_DIR:-db_data}:/var/lib/postgresql/data
    labels:
      - traefik.enable=true

  docmost-redis:
    image: redis:${REDIS_VERSION:-latest}-alpine
    container_name: docmost-redis
    restart: always
    expose:
      - 6379
    volumes:
      - ${DOCMOST_REDIS_DIR:-redis_data}:/data
    labels:
      - traefik.enable=true

volumes:
  docmost:
    name: docmost_data
    external: false
  db_data:
    name: docmost_db_data
    external: false
  redis_data:
    name: docmost_redis_data
    external: false
