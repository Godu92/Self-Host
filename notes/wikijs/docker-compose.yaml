services:
  wiki-db:
    image: postgres:${POSTGRES_VERSION:-18}-alpine
    container_name: wiki-db
    environment:
      POSTGRES_DB: wiki
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: wikijs
    logging:
      driver: none
    restart: always
    volumes:
      # Postgres 18+ moved PGDATA/its declared VOLUME to /var/lib/postgresql (not .../data)
      # - the old path silently drops data into an untracked anonymous volume instead.
      - ${WIKIJS_DB_DIR:-wiki-data}:/var/lib/postgresql

  wiki:
    image: ghcr.io/requarks/wiki:${WIKIJS_VERSION:-2}
    container_name: wiki
    depends_on:
      - wiki-db
    environment:
      DB_TYPE: postgres
      DB_HOST: wiki-db
      DB_PORT: 5432
      DB_USER: wikijs
      DB_PASS: ${DB_PASS}
      DB_NAME: wiki
    restart: always
    labels:
      - traefik.enable=true
      - traefik.http.routers.wiki.rule=Host(`wiki.$HOST`)
      - traefik.http.routers.wiki.entrypoints=http
      - traefik.http.services.wiki.loadbalancer.server.port=3000
      - kuma.wiki.http.name=Wiki.js
      - kuma.wiki.http.url=http://wiki:3000

volumes:
  wiki-data:
    name: wiki-data
    external: false
