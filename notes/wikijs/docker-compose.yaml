services:
  wiki-db:
    image: postgres:${POSTGRES_VERSION:-18}-alpine
    container_name: wiki-db
    environment:
      POSTGRES_DB: wiki
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: wikijs
    logging:
      driver: none
    restart: always
    volumes:
      # Postgres 18+ moved PGDATA/its declared VOLUME to /var/lib/postgresql (not .../data)
      # - the old path silently drops data into an untracked anonymous volume instead.
      - ${WIKIJS_DB_DIR:-wiki-data}:/var/lib/postgresql

  wiki:
    image: ghcr.io/requarks/wiki:${WIKIJS_VERSION:-2}
    container_name: wiki
    depends_on:
      - wiki-db
    environment:
      DB_TYPE: postgres
      DB_HOST: wiki-db
      DB_PORT: 5432
      DB_USER: wikijs
      DB_PASS: ${DB_PASS}
      DB_NAME: wiki
      # The bundled config.yml has no `offline` key/env placeholder at all in this image,
      # so OFFLINE_ACTIVE as an env var is a no-op - offline mode only exists via a config.yml
      # that actually sets it, hence the CONFIG_FILE override below.
      CONFIG_FILE: data/config.yml
    restart: always
    volumes:
      - ./config.yml:/wiki/data/config.yml:ro
      # Locale files can't be auto-downloaded from GitHub behind the corporate proxy
      # (surfaces as raw i18n keys like "page.Actions" instead of translated labels) -
      # sideload them per https://docs.requarks.io/en/install/sideload instead (requires
      # offline: true above, since sideloader.js only runs when WIKI.config.offline is set).
      # TODO: Need some way to load languages when behind a proxy or offline
      - ./sideload:/wiki/data/sideload:ro
    labels:
      - traefik.enable=true
      - traefik.http.routers.wiki.rule=Host(`wiki.$HOST`)
      - traefik.http.routers.wiki.entrypoints=http
      - traefik.http.services.wiki.loadbalancer.server.port=3000
      - kuma.wiki.http.name=Wiki.js
      - kuma.wiki.http.url=http://wiki:3000

volumes:
  wiki-data:
    name: wiki-data
    external: false
