services:
  adventure-web:
    #build: ./frontend/
    image: ghcr.io/seanmorley15/adventurelog-frontend:${ADVENTURELOG_FRONTEND_VERSION:-latest}
    container_name: adventurelog-frontend
    restart: always
    environment:
      - PUBLIC_SERVER_URL=http://server:8000 # Should be the service name of the backend with port 8000, even if you change the port in the backend service
      - ORIGIN=http://localhost:8015
      - BODY_SIZE_LIMIT=Infinity
    # ports:
    #   - "8015:3000"
    depends_on:
      - adventure-server
    labels:
      - traefik.enable=true
      - traefik.http.routers.adventure.rule=Host(`adventure.$HOST`)
      - traefik.http.routers.adventure.entrypoints=http
      - traefik.http.services.adventure.loadbalancer.server.port=3000

  adventure-db:
    image: postgis/postgis:${POSTGIS_VERSION:-latest}-3.3
    container_name: adventurelog-db
    restart: always
    environment:
      POSTGRES_DB: database
      POSTGRES_USER: adventure
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ${ADVENTURELOG_DB_DIR:-postgres_data}:/var/lib/postgresql/data/
    labels:
      - traefik.enable=true

  adventure-server:
    #build: ./backend/
    image: ghcr.io/seanmorley15/adventurelog-backend:${ADVENTURELOG_BACKEND_VERSION:-latest}
    container_name: adventurelog-backend
    restart: always
    environment:
      - PGHOST=db
      - PGDATABASE=database
      - PGUSER=adventure
      - PGPASSWORD=${POSTGRES_PASSWORD}
      - SECRET_KEY=${SECRET_KEY}
      - DJANGO_ADMIN_USERNAME=admin
      - DJANGO_ADMIN_PASSWORD=${DJANGO_ADMIN_PASSWORD}
      - DJANGO_ADMIN_EMAIL=admin@example.com
      - PUBLIC_URL=http://localhost:8016 # Match the outward port, used for the creation of image urls
      - CSRF_TRUSTED_ORIGINS=http://localhost:8016,http://localhost:8015 # Comma separated list of trusted origins for CSRF
      - DEBUG=False
      - FRONTEND_URL=http://localhost:8015 # Used for email generation. This should be the url of the frontend
    ports:
      - "8016:80"
    depends_on:
      - adventure-db
    volumes:
      - ${ADVENTURELOG_MEDIA_DIR:-adventurelog_media}:/code/media/
    labels:
      - traefik.enable=true

volumes:
  postgres_data:
    name: adventurelog_postgres_data
    external: false
  adventurelog_media:
    name: adventurelog_media
    external: false
