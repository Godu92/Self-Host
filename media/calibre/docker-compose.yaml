x-settings: &common
  environment:
    - PUID=1000
    - PGID=1000
    - TZ=Etc/UTC

services:
  calibre-web:
    <<: *common
    image: lscr.io/linuxserver/calibre-web:${CALIBRE_WEB_VERSION:-latest}
    container_name: calibre-web
    volumes:
      - /path/to/data:/config
      - /path/to/calibre/library:/books
    # ports:
    #   - 8083:8083
    restart: always
    labels:
      - traefik.enable=true
      - traefik.http.routers.books.rule=Host(`books.$HOST`)
      - traefik.http.routers.books.entrypoints=http
      - traefik.http.services.books.loadbalancer.server.port=8083
      - kuma.books.http.name=Calibre-Web
      - kuma.books.http.url=http://calibre-web:8083

  calibre:
    <<: *common
    image: lscr.io/linuxserver/calibre:${CALIBRE_VERSION:-latest}
    container_name: calibre
    volumes:
      - /path/to/calibre/config:/config
    # ports:
    #   - 8080:8080
    #   - 8181:8181
    #   - 8081:8081
    restart: always
    labels:
      - traefik.enable=true
      - traefik.http.routers.books-db.rule=Host(`books-db.$HOST`)
      - traefik.http.routers.books-db.entrypoints=http
      - traefik.http.services.books-db.loadbalancer.server.port=8080
      - kuma.books-db.http.name=Calibre
      - kuma.books-db.http.url=http://calibre:8080
