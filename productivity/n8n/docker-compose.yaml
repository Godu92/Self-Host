# version: "3.8"
volumes:
  db_storage:
    name: n8n_db_storage
    external: false
  n8n_storage:
    name: n8n_storage
    external: false

services:
  n8n-db:
    image: postgres:${POSTGRES_VERSION:-latest}
    container_name: n8n-db
    restart: always
    environment:
      - POSTGRES_DB=n8n
      - POSTGRES_USER=changeUser
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_NON_ROOT_USER=changeUser
      - POSTGRES_NON_ROOT_PASSWORD=${POSTGRES_NON_ROOT_PASSWORD}
    volumes:
      - ${N8N_DB_DIR:-db_storage}:/var/lib/postgresql/data
      # - ./init-data.sh:/docker-entrypoint-initdb.d/init-data.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U changeUser -d n8n"]
      interval: 5s
      timeout: 5s
      retries: 10
    # No Traefik labels: postgres has no HTTP interface to route to. The commented block that
    # used to live here (a router pointed at port 443) was copy-pasted from an unrelated
    # service and never made sense for a database container — removed rather than kept as a
    # misleading template.

  n8n:
    image: docker.n8n.io/n8nio/n8n:${N8N_VERSION:-latest}
    container_name: n8n
    restart: always
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=n8n-db
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=changeUser
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
      - N8N_SECURE_COOKIE=false
    # ports:
    #   - 5678:5678
    links:
      - n8n-db
    volumes:
      - ${N8N_DATA_DIR:-n8n_storage}:/home/node/.n8n
    depends_on:
      n8n-db:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.http.routers.n8n.rule=Host(`n8n.$HOST`) || Host(`n8n.$HOSTNAME`)
      - traefik.http.routers.n8n.entrypoints=http
      - traefik.http.services.n8n.loadbalancer.server.port=5678
      - kuma.n8n.http.name=n8n
      - kuma.n8n.http.url=http://n8n:5678
