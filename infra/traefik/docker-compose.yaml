services:
  reverse-proxy:
    # The official v3 Traefik docker image
    image: traefik:${TRAEFIK_VERSION:-latest}
    container_name: traefik
    restart: always
    # Enables the web UI and tells Traefik to listen to docker via the
    # socket-proxy (infra/socket) instead of mounting docker.sock directly.
    command:
      - "--api.insecure=true"
      - "--api.dashboard=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedByDefault=false"
      - "--providers.docker.endpoint=tcp://socket-proxy:2375"
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
      - "--entryPoints.http.address=:80"
      - "--entryPoints.https.address=:443"
    networks:
      default:
      socket_proxy:
    ports:
      # The HTTP port
      - "80:80"
      - "443:443"
      # The Web UI (enabled by --api.insecure=true)
      - "8080:8080"
    volumes:
      - ./certs:/certs:ro
      - ./dynamic:/etc/traefik/dynamic:ro
    labels:
      - traefik.enable=true
      - traefik.http.routers.proxy.rule=Host(`proxy.$HOST`) || Host(`proxy.$HOSTNAME`)
      - traefik.http.routers.proxy.entrypoints=http
      - traefik.http.routers.proxy-secure.rule=Host(`proxy.$HOSTNAME`)
      - traefik.http.routers.proxy-secure.entrypoints=https
      - traefik.http.routers.proxy-secure.tls=true
      - traefik.http.services.proxy.loadbalancer.server.port=8080
      - kuma.proxy.http.name=Traefik
      - kuma.proxy.http.url=http://traefik:8080
