# Ollama isn't defined here — it already runs as the `ollama` service in
# ai/notebook/opennotebook-single/docker-compose.yaml, reachable on the
# shared proxy network at http://ollama:11434 (also routed at ollama.$HOST).
# Open WebUI reuses that same instance instead of running a second one, so
# this stack only serves double duty once both compose files are included
# together. TODO: extract ollama into its own service dir so open-webui
# doesn't implicitly depend on the notebook stack being the one that starts it.
services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:${OPEN_WEBUI_VERSION:-main}
    container_name: open-webui
    restart: always
    volumes:
      - ${OPEN_WEBUI_DATA_DIR:-open-webui}:/app/backend/data
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY}
    extra_hosts:
      - host.docker.internal:host-gateway
    # ports:
    #   - "3000:8080"
    labels:
      - traefik.enable=true
      - traefik.http.routers.chat.rule=Host(`chat.$HOST`)
      - traefik.http.routers.chat.entrypoints=http
      - traefik.http.services.chat.loadbalancer.server.port=8080
      - kuma.chat.http.name=Open WebUI
      - kuma.chat.http.url=http://open-webui:8080

volumes:
  open-webui:
    name: open_webui_data
    external: false
