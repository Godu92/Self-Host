# Ollama moved to ai/ollama/docker-compose.yaml (2026-07-27) so it can also serve
# ai/webui without a second instance. Include that file alongside this one — this
# service's docker.env still just points OLLAMA_API_BASE at http://ollama:11434 by
# container name, resolved over the shared proxy network.
services:
  # Single container with everything built-in (eliminates networking issues)
  open-notebook-single:
    # `latest-single` on Docker Hub is stale (last published 2025-10-15, ~9 months
    # behind numbered releases as of this pin) and missing a real fix (Content
    # Settings, e.g. the URL extraction engine choice, wasn't actually read from
    # the database yet) — verified live 2026-07-26. Pin to a real recent release
    # instead of trusting the floating tag here.
    image: lfnovo/open_notebook:${OPEN_NOTEBOOK_VERSION:-1.14.0}-single
    container_name: open-notebook-single
    restart: unless-stopped
    volumes:
      - ./notebook_data:/app/data
      - ./surreal_data:/mydata
      # - ./certs/tls-ca-bundle.pem:/etc/pki/ca-trust/extracted/pem/tls-ca-bundle.pem:ro
    env_file:
      - ./docker.env
    ports:
      - "8502:8502" # Streamlit UI
      - "5055:5055" # FastAPI backend
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.http.routers.notebook.rule=Host(`notebook.${HOST}`)
      - traefik.http.routers.notebook.entrypoints=http
      - traefik.http.services.notebook.loadbalancer.server.port=8502
      - kuma.notebook.http.name=Open Notebook
      - kuma.notebook.http.url=http://open-notebook-single:8502

networks:
  proxy:
    external: true

volumes:
  notebook_data:
    name: notebook_data
    external: false
  surreal_data:
    name: surreal_data
    external: false
