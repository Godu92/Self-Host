# Standalone Ollama, shared by anything in the ai/ group that needs local-LLM
# inference — currently ai/notebook/opennotebook-single and ai/webui. Include this
# file alongside either (or both) rather than each defining its own; they all
# reach it as http://ollama:11434 over the shared proxy network.
services:
  ollama:
    image: ollama/ollama:${OLLAMA_VERSION:-latest}
    container_name: ollama
    restart: always
    ports:
      - 11434:11434
    volumes:
      - ${OLLAMA_DATA_DIR:-ollama_data}:/root/.ollama
    labels:
      - traefik.enable=true
      - traefik.http.routers.ollama.rule=Host(`ollama.$HOST`)
      - traefik.http.routers.ollama.entrypoints=http
      - traefik.http.services.ollama.loadbalancer.server.port=11434
      - kuma.ollama.http.name=Ollama
      - kuma.ollama.http.url=http://ollama:11434

volumes:
  ollama_data:
    name: ollama_data
    external: false
