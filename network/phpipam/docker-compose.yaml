# version: '3'

services:
  phpipam-web:
    container_name: phpipam-web
    image: phpipam/phpipam-www:${PHPIPAM_VERSION:-latest}
    # ports:
    #   - "80:80"
    environment:
      - TZ=America/New_York
      - IPAM_DATABASE_HOST=phpipam-mariadb
      - IPAM_DATABASE_PASS=${IPAM_DATABASE_PASS}
      - IPAM_DATABASE_WEBHOST=%
      - IPAM_DATABASE_USER=phpipam
    restart: unless-stopped
    volumes:
      - ${PHPIPAM_LOGO_DIR:-phpipam-logo}:/phpipam/css/images/logo
      - ${PHPIPAM_CA_DIR:-phpipam-ca}:/usr/local/share/ca-certificates:ro
    depends_on:
      - phpipam-mariadb
    cap_add:
      - NET_ADMIN
      - NET_RAW
    labels:
      - traefik.enable=true
      - traefik.http.routers.php.rule=Host(`php.$HOST`)
      - traefik.http.routers.php.entrypoints=http
      - traefik.http.services.php.loadbalancer.server.port=80

  phpipam-cron:
    container_name: phpipam-cron
    image: phpipam/phpipam-cron:${PHPIPAM_VERSION:-latest}
    environment:
      - TZ=America/New_York
      - IPAM_DATABASE_HOST=phpipam-mariadb
      - IPAM_DATABASE_PASS=${IPAM_DATABASE_PASS}
      - SCAN_INTERVAL=1h
    restart: unless-stopped
    volumes:
      - ${PHPIPAM_CA_DIR:-phpipam-ca}:/usr/local/share/ca-certificates:ro
    depends_on:
      - phpipam-mariadb
    cap_add:
      - NET_ADMIN
      - NET_RAW

  phpipam-mariadb:
    container_name: phpipam-mariadb
    image: mariadb:${MARIADB_VERSION:-latest}
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=phpipam
      - MYSQL_USER=phpipam
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
    restart: unless-stopped
    volumes:
      - ${PHPIPAM_DB_DIR:-phpipam-db-data}:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      timeout: 20s
      retries: 10
      interval: 30s
      start_period: 60s

volumes:
  phpipam-db-data:
    name: phpipam-db-data
    external: false
  phpipam-logo:
    name: phpipam-logo
    external: false
  phpipam-ca:
    name: phpipam-ca
    external: false
