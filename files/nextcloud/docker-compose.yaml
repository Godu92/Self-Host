services:
  nextcloud:
    image: lscr.io/linuxserver/nextcloud:${NEXTCLOUD_VERSION:-latest}
    container_name: nextcloud
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - ./config:/config
      - ./data:/data
    ports:
      - 443:443
    restart: always
    # No Traefik labels currently — nextcloud is reached directly via its published :443 port,
    # not proxied. To route it through Traefik instead, add:
    #   labels:
    #     - traefik.enable=true
    #     - traefik.http.routers.next.rule=Host(`next.$HOST`)
    #     - traefik.http.routers.next.entrypoints=http
    #     - traefik.http.services.next.loadbalancer.server.port=443
