  # - identity/lldap/docker-compose.yaml
  #   Provides the shared read-only identity the n8n workflow above actually needs: a
  #   `svc-wikijs-ro` user in a `svc-readonly` group, wired to Wiki.js as an LDAP auth
  #   strategy. Provisioned via LLDAP's GraphQL API + its `lldap_set_password` CLI (no
  #   REST/GraphQL password mutation exists - see KNOWLEDGE.md). Confirmed Gitea works with
  #   LDAP too (incl. SSH keys); n8n LDAP is Enterprise-only so n8n itself just calls
  #   Wiki.js's HTTP API instead of speaking LDAP directly.
