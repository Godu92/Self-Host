## Deploy style: knowledge
## Thought-experiment slice of a "living memory" idea: write durable notes in Docmost,
## then ask questions about them via Open Notebook's local-LLM RAG layer. No automation
## wired up yet — for now, sources get added to Open Notebook by hand. The point of this
## style is just to test whether the human-writes / AI-queries loop is actually useful
## before investing in anything below.

include:
  ### notes — durable, human-reviewed record (e.g. incident reports, decisions)
  - notes/docmost/docker-compose.yaml

  ### ai — ask questions across whatever's been fed into it
  - ai/notebook/opennotebook-single/docker-compose.yaml

