## Deploy style: knowledge
## Thought-experiment slice of a "living memory" idea: write durable notes in Wiki.js,
## then ask questions about them via Open Notebook's local-LLM RAG layer. Wiki.js was
## chosen over Docmost specifically for this style because change-metadata is readable
## with zero auth (Guests group + an anonymous `pages.list`/`pages.tree` GraphQL feed,
## verified live 2026-07-26) — a better fit for the automated write/read loop this style
## is testing. Actual page *content* still needs a scoped read-only account though
## (Wiki.js pages are a client-rendered SPA, and the GraphQL query that returns raw
## content — `pages.single` — checks view permission more strictly than `list`/`tree` do;
## see KNOWLEDGE.md). Docmost stays in `notes/docmost` for more human-facing note-taking
## use, just not part of this experiment. No automation wired up yet — for now, sources
## get added to Open Notebook by hand. The point of this style is just to test whether the
## human-writes / AI-queries loop is actually useful before investing in anything below.

include:
  ### notes — durable, human-reviewed record (e.g. incident reports, decisions);
  ### change-metadata is readable anonymously, actual content needs a read-only account
  - notes/wikijs/docker-compose.yaml

  ### ai — ask questions across whatever's been fed into it
  ### ollama moved to its own file 2026-07-27 so it can also serve ai/webui
  - ai/ollama/docker-compose.yaml
  - ai/notebook/opennotebook-single/docker-compose.yaml

  ## --- Future potential, not wired up, don't enable blindly ---
