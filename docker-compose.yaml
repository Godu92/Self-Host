## Base compose file — shared network, Traefik, and a whoami test target.
## `docker compose up -d` alone gets you a working, instantly-testable setup.
## Enable more services via a deploy-style override, e.g.:
##   docker compose -f docker-compose.yaml -f compose.local.yaml up -d
## See README.md for how to define additional styles.

networks:
  default:
    driver: bridge
    name: proxy
    external: false
  # socket_proxy:
  #   name: socket_proxy
  #   driver: bridge
  #   ipam:
  #     config:
  #       - subnet: 192.168.91.0/24

include:
  ### Routing
  - infra/traefik/docker-compose.yaml
  # - infra/socket/docker-compose.yaml

  ### Testing
  - infra/whoami/docker-compose.yaml
